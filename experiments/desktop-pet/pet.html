<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>桌宠</title><link rel="stylesheet" href="./pet-window.css"/></head><body><main class="pet-window" aria-label="角色桌宠"><button id="close" class="close" type="button">×</button><button id="back" class="back" type="button">返回</button><button id="openHistory" class="history" type="button">···</button><section class="speech-area"><button id="speech" class="speech" type="button"></button></section><div class="pet" title="按住角色拖动窗口"><span class="halo"></span><img id="petImage" alt="角色形象"/><div class="role-bar"><form id="quickForm" class="quick-input"><input id="quickInput" autocomplete="off" placeholder="给角色留言…"/><button type="submit" aria-label="发送">↑</button></form><p id="petName">角色</p></div></div><p class="hint">按住角色拖动 · 四角拖拽缩放</p><i class="resize-handle nw" data-corner="nw"></i><i class="resize-handle ne" data-corner="ne"></i><i class="resize-handle sw" data-corner="sw"></i><i class="resize-handle se" data-corner="se"></i><section class="chat-panel" hidden><header><div><p>桌宠私聊</p><select id="sessionSelect" aria-label="选择私聊会话"></select></div><button id="closeChat" type="button">收起</button></header><div id="messages" class="messages"></div><form id="chatForm"><input id="chatInput" autocomplete="off" placeholder="说点什么…"/><button type="submit">发送</button></form><p id="chatError" class="chat-error"></p></section></main><script src="./pet-window.js"></script></body></html>
