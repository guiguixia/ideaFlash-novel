<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色桌宠</title>
  <link rel="stylesheet" href="./pet-window.css" />
</head>
<body>
  <main class="pet-window" aria-label="角色桌宠">
    <button id="close" class="close" type="button" aria-label="关闭桌宠">×</button>
    <section class="speech" aria-live="polite"><p id="speech">陪你读完这一段故事。</p></section>
    <div id="pet" class="pet" title="按住角色拖动窗口">
      <span class="halo"></span>
      <img id="petImage" alt="角色桌宠形象" />
      <p id="petName"></p>
    </div>
    <p class="hint">按住角色拖动 · 四角拖拽缩放</p>
    <i class="resize-handle nw" data-corner="nw"></i><i class="resize-handle ne" data-corner="ne"></i>
    <i class="resize-handle sw" data-corner="sw"></i><i class="resize-handle se" data-corner="se"></i>
  </main>
  <script src="./pet-window.js"></script>
</body>
</html>
